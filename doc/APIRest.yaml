openapi: 3.0.0
info:
  title: API de Gases y Usuarios
  version: 1.0.0
  description: API REST para gestionar medidas de gases y usuarios.
servers:
  - url: http://localhost:3000/api
    description: Servidor local para desarrollo

paths:
  /medidas:
    get:
      summary: Obtener todas las medidas de gas
      responses:
        '200':
          description: Lista de medidas de gas obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    gas:
                      type: string
                    valor:
                      type: number
                    hora:
                      type: string
                      format: date-time
                    latitud:
                      type: number
                    longitud:
                      type: number
                    sensor:
                      type: string
        '500':
          description: Error al obtener las medidas de gas

    post:
      summary: Agregar una nueva medida de gas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gas:
                  type: string
                valor:
                  type: number
                hora:
                  type: string
                  format: date-time
                latitud:
                  type: number
                longitud:
                  type: number
                sensor:
                  type: string
      responses:
        '201':
          description: Medida de gas creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  gas:
                    type: string
                  valor:
                    type: number
                  hora:
                    type: string
                    format: date-time
                  latitud:
                    type: number
                  longitud:
                    type: number
                  sensor:
                    type: string
        '400':
          description: Faltan datos requeridos
        '500':
          description: Error al insertar la medida

  /usuarios:
    get:
      summary: Obtener un usuario por correo y contraseña
      parameters:
        - in: query
          name: Correo
          required: true
          schema:
            type: string
        - in: query
          name: Contrasenya
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ID_Usuarios:
                    type: integer
                  Nombre:
                    type: string
                  Apellidos:
                    type: string
                  Correo:
                    type: string
                  Telefono:
                    type: string
                  Verificado:
                    type: integer
        '401':
          description: Credenciales incorrectas
        '500':
          description: Error al obtener el usuario

    post:
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                apellidos:
                  type: string
                correo:
                  type: string
                contrasenya:
                  type: string
                telefono:
                  type: string
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nombre:
                    type: string
                  apellidos:
                    type: string
                  correo:
                    type: string
                  telefono:
                    type: string
                  verificado:
                    type: integer
        '400':
          description: Faltan datos requeridos
        '500':
          description: Error al registrar el usuario

  /usuario/{correo}:
    get:
      summary: Obtener datos del usuario por correo
      parameters:
        - in: path
          name: correo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ID_Usuarios:
                    type: integer
                  Nombre:
                    type: string
                  Apellidos:
                    type: string
                  Correo:
                    type: string
                  Telefono:
                    type: string
                  Verificado:
                    type: integer
        '404':
          description: Usuario no encontrado
        '500':
          description: Error al obtener el perfil del usuario

    put:
      summary: Actualizar datos del usuario
      parameters:
        - in: path
          name: correo
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Nombre:
                  type: string
                Apellidos:
                  type: string
                Telefono:
                  type: string
                Contrasenya:
                  type: string
      responses:
        '200':
          description: Usuario actualizado correctamente
        '404':
          description: Usuario no encontrado
        '500':
          description: Error al actualizar el perfil

  /usuario/{correo}/cambiar-contrasena:
    put:
      summary: Cambiar la contraseña del usuario
      parameters:
        - in: path
          name: correo
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contrasenaActual:
                  type: string
                contrasenaNueva:
                  type: string
      responses:
        '200':
          description: Contraseña actualizada correctamente
        '401':
          description: La contraseña actual es incorrecta
        '500':
          description: Error al cambiar la contraseña

  /usuarios/verify/{userId}:
    get:
      summary: Verificar cuenta de usuario
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cuenta verificada exitosamente
        '404':
          description: Usuario no encontrado
        '500':
          description: Error al verificar el usuario
